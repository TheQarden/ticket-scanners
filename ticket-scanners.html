<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>QR Сканер - Быстрое распознавание</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #121826 0%, #1e2a3a 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .scanner-card {
            background: rgba(30, 35, 48, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08);
            width: 100%;
            max-width: 520px;
            padding: 24px 20px 32px;
            transition: all 0.2s ease;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 1.9rem;
            font-weight: 600;
            text-align: center;
            background: linear-gradient(135deg, #FFFFFF, #B0C4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .sub {
            text-align: center;
            color: #9aa7c0;
            margin-bottom: 28px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .video-container {
            position: relative;
            background: #000000;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            aspect-ratio: 4 / 3;
            width: 100%;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: 2px solid rgba(0, 255, 200, 0.5);
            border-radius: 32px;
            box-shadow: inset 0 0 30px rgba(0,255,200,0.2);
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 5%;
            width: 90%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0ff, #0ff, transparent);
            animation: scanMove 2.2s ease-in-out infinite;
            border-radius: 4px;
            box-shadow: 0 0 10px #0ff;
        }
        @keyframes scanMove {
            0% { top: 8%; opacity: 0.6; }
            50% { top: 88%; opacity: 1; }
            100% { top: 8%; opacity: 0.6; }
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin: 24px 0 20px;
        }
        button {
            background: #2e3b4e;
            border: none;
            padding: 12px 26px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        button i {
            font-style: normal;
            font-weight: bold;
            font-size: 1.2rem;
        }
        button.primary {
            background: #2c7da0;
            box-shadow: 0 4px 12px rgba(44,125,160,0.4);
        }
        button.primary:hover {
            background: #1f6390;
            transform: scale(0.98);
        }
        button.danger {
            background: #4a3b52;
        }
        button.danger:hover {
            background: #5e4b6b;
        }
        button:hover {
            filter: brightness(1.05);
            transform: scale(0.97);
        }
        .result-area {
            background: #1a1e2a;
            border-radius: 36px;
            padding: 18px 20px;
            margin-top: 10px;
            border: 1px solid #2d3548;
        }
        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: #70b9e0;
            margin-bottom: 8px;
        }
        #resultText {
            word-break: break-all;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.95rem;
            background: #0f121c;
            padding: 14px 18px;
            border-radius: 28px;
            color: #ccdeee;
            margin: 8px 0;
            border-left: 4px solid #2c7da0;
            max-height: 110px;
            overflow-y: auto;
        }
        .copy-btn {
            background: #1f6e43;
            padding: 8px 18px;
            font-size: 0.8rem;
            margin-top: 6px;
            display: inline-block;
        }
        .status-msg {
            font-size: 0.8rem;
            color: #bdd4ff;
            text-align: center;
            margin-top: 12px;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            color: #5f6c84;
            margin-top: 22px;
        }
        @media (max-width: 550px) {
            .scanner-card { padding: 16px; }
            button { padding: 9px 18px; font-size: 0.85rem; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="scanner-card">
    <h1>◈ QR Сканер ◈<br>Created by TheQarden<br></h1>
    <div class="sub">наведите камеру на QR-код</div>

    <div class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-overlay"></div>
        <div class="scan-line"></div>
    </div>

    <div class="controls">
        <button id="startCamBtn" class="primary">▶ ЗАПУСТИТЬ КАМЕРУ</button>
        <button id="stopCamBtn" class="danger">■ ОСТАНОВИТЬ</button>
    </div>

    <div class="result-area">
        <div class="result-label">● РЕЗУЛЬТАТ РАСПОЗНАВАНИЯ ●</div>
        <div id="resultText">ожидание сканирования...</div>
        <button id="copyResultBtn" style="background:#38546b; display: flex; align-items:center; gap: 6px;">⎘ КОПИРОВАТЬ ТЕКСТ</button>
        <div id="copyStatus" class="status-msg"></div>
    </div>
    <footer>АВТОМАТИЧЕСКОЕ РАСПОЗНАВАНИЕ • ПОДДЕРЖИВАЮТСЯ ЛЮБЫЕ QR‑КОДЫ</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
    (function() {
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startCamBtn');
        const stopBtn = document.getElementById('stopCamBtn');
        const resultDiv = document.getElementById('resultText');
        const copyBtn = document.getElementById('copyResultBtn');
        const copyStatusSpan = document.getElementById('copyStatus');
        
        let stream = null;
        let animationId = null;
        let scanningActive = false;
        
        function stopScanner() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            scanningActive = false;
            
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => {
                    track.stop();
                });
                stream = null;
            }
            if (video) {
                video.srcObject = null;
            }
        }
        
        async function startCamera(facingMode = 'environment') {
            stopScanner();
            
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                try {
                    const fallbackConstraints = { video: true };
                    stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                } catch (fallbackErr) {
                    resultDiv.innerText = "[X] Нет доступа к камере. Проверьте разрешения.";
                    return false;
                }
            }
            
            if (stream) {
                video.srcObject = stream;
                await video.play();
                scanningActive = true;
                startScanningLoop();
                return true;
            }
            return false;
        }
        
        function startScanningLoop() {
            if (!video || !video.videoWidth || !video.videoHeight) {
                if (scanningActive) {
                    animationId = requestAnimationFrame(() => startScanningLoop());
                }
                return;
            }
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const width = video.videoWidth;
            const height = video.videoHeight;
            canvas.width = width;
            canvas.height = height;
            
            function tick() {
                if (!scanningActive || !stream || video.paused || video.ended) {
                    return;
                }
                
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    try {
                        context.drawImage(video, 0, 0, width, height);
                        const imageData = context.getImageData(0, 0, width, height);
                        const qrCode = jsQR(imageData.data, width, height, {
                            inversionAttempts: "dontInvert",
                        });
                        
                        if (qrCode && qrCode.data) {
                            const decodedText = qrCode.data.trim();
                            if (decodedText.length > 0) {
                                resultDiv.innerText = decodedText;
                                if (navigator.vibrate) navigator.vibrate(200);
                            }
                        }
                    } catch (e) {
                        console.warn(e);
                    }
                }
                
                if (scanningActive) {
                    animationId = requestAnimationFrame(tick);
                }
            }
            
            if (animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(tick);
        }
        
        startBtn.addEventListener('click', async () => {
            resultDiv.innerText = "[...] Запрос доступа к камере...";
            const success = await startCamera('environment');
            if (success) {
                resultDiv.innerText = "[>>] Сканирование... наведите на QR";
                copyStatusSpan.innerText = "";
            } else {
                resultDiv.innerText = "[!] Не удалось запустить камеру.";
            }
        });
        
        stopBtn.addEventListener('click', () => {
            stopScanner();
            resultDiv.innerText = "[ ] Сканер остановлен. Нажмите «ЗАПУСТИТЬ КАМЕРУ»";
            copyStatusSpan.innerText = "";
        });
        
        copyBtn.addEventListener('click', async () => {
            const textToCopy = resultDiv.innerText;
            if (!textToCopy || textToCopy === "- ожидание сканирования -" || textToCopy.includes("[") || textToCopy.includes("]") || textToCopy.includes("...")) {
                copyStatusSpan.innerText = "[X] Нет данных для копирования (отсканируйте код)";
                setTimeout(() => { copyStatusSpan.innerText = ""; }, 1800);
                return;
            }
            try {
                await navigator.clipboard.writeText(textToCopy);
                copyStatusSpan.innerText = "[✓] Скопировано в буфер!";
                setTimeout(() => { copyStatusSpan.innerText = ""; }, 2000);
            } catch (err) {
                copyStatusSpan.innerText = "[!] Ошибка копирования";
                setTimeout(() => { copyStatusSpan.innerText = ""; }, 1500);
            }
        });
        
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stopScanner();
            }
        });
        
        resultDiv.innerText = "ожидание сканирования";
    })();
</script>
</body>
</html>
